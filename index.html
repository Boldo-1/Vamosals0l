<script>
const cards=[...document.querySelectorAll('.photo')],dialog=document.querySelector('dialog'),viewer=document.querySelector('.viewer'),preview=document.querySelector('.hover-preview'),previewImage=preview.querySelector('img');let current=0,timer,lastFocus;
function hidePreview(){clearTimeout(timer);preview.style.display='none'}
function showPhoto(index){current=(index+cards.length)%cards.length;const card=cards[current];viewer.src=card.href;viewer.alt=card.querySelector('img').alt;document.querySelector('#position').textContent=`${String(current+1).padStart(3,'0')} / ${cards.length}`;document.querySelector('.caption').textContent=viewer.alt;for(const step of [-1,1]){const preload=new Image();preload.src=cards[(current+step+cards.length)%cards.length].href}}
cards.forEach((card,index)=>{card.addEventListener('click',event=>{event.preventDefault();hidePreview();lastFocus=card;showPhoto(index);dialog.showModal();document.body.classList.add('modal');document.querySelector('.close').focus()});card.addEventListener('pointerenter',()=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches||dialog.open)return;timer=setTimeout(()=>{const img=card.querySelector('img'),ratio=img.width/img.height;let height=Math.min(innerHeight*.72,620),width=height*ratio;if(width>innerWidth*.48){width=innerWidth*.48;height=width/ratio}const rect=card.getBoundingClientRect();let left=rect.right+12;if(left+width>innerWidth-12)left=rect.left-width-12;left=Math.max(12,Math.min(left,innerWidth-width-12));const top=Math.max(12,Math.min(rect.top+rect.height/2-height/2,innerHeight-height-12));Object.assign(preview.style,{width:width+'px',height:height+'px',left:left+'px',top:top+'px',display:'block'});previewImage.src=card.href},180)});card.addEventListener('pointerleave',hidePreview)});
document.querySelector('.close').onclick=()=>dialog.close();document.querySelector('.prev').onclick=()=>showPhoto(current-1);document.querySelector('.next').onclick=()=>showPhoto(current+1);dialog.addEventListener('close',()=>{document.body.classList.remove('modal');lastFocus?.focus({preventScroll:true})});dialog.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){event.preventDefault();showPhoto(current+1)}if(event.key==='ArrowLeft'){event.preventDefault();showPhoto(current-1)}});let touchX=0,touchY=0;viewer.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)showPhoto(current+(dx<0?1:-1))},{passive:true});addEventListener('scroll',hidePreview,{passive:true});addEventListener('resize',hidePreview);
</script>
